{% extends "layout/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg mt-5" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="mb-3" style="font-size: 3rem;">
                        <i class="fas fa-lock" style="color: #667eea;"></i>
                    </div>
                    <h3 class="card-title fw-bold" style="color: #2d3748;">Welcome Back</h3>
                    <p class="text-muted">Sign in to continue to HireHub</p>
                </div>
                
                <form action="/login" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="fas fa-user me-2"></i>Username
                        </label>
                        <input type="text" name="username" class="form-control" placeholder="ishita@admin or your username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="fas fa-key me-2"></i>Password
                        </label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>
                </form>
                
                <div class="text-center small mt-4">
                    
                    <hr class="my-3">
                    <p class="mb-0 text-muted">
                        New User? <a href="/register" class="text-decoration-none fw-semibold" style="color: #667eea;">Create an account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
