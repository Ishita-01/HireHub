<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HireHub Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">HireHub</a>
        
        <div class="navbar-nav ms-auto">
          {% if user %}
            <span class="navbar-text text-light me-3">Welcome, {{ user.username }}</span>

            {% if user.role.value == 'admin' %}
              <a class="nav-link text-warning" href="/scrape-test">🔄 Sync Jobs</a>
            {% endif %}

            <a class="nav-link" href="/jobs">View Jobs</a>

            
            <a class="nav-link" href="/applications">Applications</a>
            <a class="nav-link" href="/analyze">Analyze Resume</a>
            <a class="nav-link" href="/profile">Profile</a>
            <a class="nav-link" href="/logout">Logout</a>
          {% else %}
            <a class="nav-link" href="/login">Sign In</a>
          {% endif %}
          
        </div>
      </div>
    </nav>

    <div class="container">
      {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
