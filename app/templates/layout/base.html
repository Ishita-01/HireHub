<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HireHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      --danger-gradient: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .navbar {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%) !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 1rem 0;
    }
    
    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 0%, #a8edea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .nav-link {
      color: rgba(255,255,255,0.85) !important;
      font-weight: 500;
      transition: all 0.3s ease;
      margin: 0 0.25rem;
      padding: 0.5rem 1rem !important;
      border-radius: 8px;
    }
    
    .nav-link:hover {
      color: #fff !important;
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
    
    .nav-link.text-warning {
      background: rgba(255,193,7,0.15);
    }
    
    .navbar-text {
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      overflow: hidden;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    
    .card-title {
      color: #2d3748;
      font-weight: 700;
    }
    
    .btn-primary {
      background: var(--primary-gradient);
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: var(--success-gradient);
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(17, 153, 142, 0.3);
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
    }
    
    .btn-outline-primary, .btn-outline-secondary, .btn-outline-danger {
      border-width: 2px;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    
    .btn-outline-primary:hover, .btn-outline-secondary:hover, .btn-outline-danger:hover {
      transform: translateY(-2px);
    }
    
    .form-control, .form-select {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      transition: all 0.3s ease;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
    }
    
    .table {
      border-radius: 12px;
      overflow: hidden;
    }
    
    .table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .table-hover tbody tr:hover {
      background-color: rgba(102, 126, 234, 0.05);
      transform: scale(1.01);
      transition: all 0.2s ease;
    }
    
    .badge {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 600;
    }
    
    .alert {
      border: none;
      border-radius: 12px;
      border-left: 4px solid;
    }
    
    .alert-info {
      background: linear-gradient(135deg, #e0f2fe 0%, #bfdbfe 100%);
      border-left-color: #3b82f6;
    }
    
    .alert-success {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      border-left-color: #22c55e;
    }
    
    .modal-content {
      border-radius: 16px;
      border: none;
    }
    
    .modal-header {
      background: var(--primary-gradient);
      color: white;
      border-radius: 16px 16px 0 0;
    }
    
    .btn-close {
      filter: brightness(0) invert(1);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-rocket me-2"></i>HireHub</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          {% if user %}
            <span class="navbar-text text-light me-3">
              <i class="fas fa-user-circle me-2"></i>{{ user.username }}
            </span>

            {% if user.role.value == 'admin' %}
              <a class="nav-link text-warning" href="/scrape-test">
                <i class="fas fa-sync-alt me-1"></i>Sync Jobs
              </a>
            {% endif %}

            <a class="nav-link" href="/jobs">
              <i class="fas fa-briefcase me-1"></i>View Jobs
            </a>
            <a class="nav-link" href="/applications">
              <i class="fas fa-clipboard-list me-1"></i>Applications
            </a>
            <a class="nav-link" href="/analyze">
              <i class="fas fa-chart-line me-1"></i>Analyze Resume
            </a>
            <a class="nav-link" href="/profile">
              <i class="fas fa-user-cog me-1"></i>Profile
            </a>
            <a class="nav-link" href="/logout">
              <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
          {% else %}
            <a class="nav-link" href="/login">
              <i class="fas fa-sign-in-alt me-1"></i>Sign In
            </a>
            <a class="nav-link" href="/register" >
              <i class="fas fa-user-plus me-1"></i>Sign Up
            </a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
