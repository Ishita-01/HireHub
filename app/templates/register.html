{% extends "layout/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg mt-5" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="mb-3" style="font-size: 3rem;">
                        <i class="fas fa-user-plus" style="color: #11998e;"></i>
                    </div>
                    <h3 class="card-title fw-bold" style="color: #2d3748;">Create New Account</h3>
                    <p class="text-muted">Join HireHub and start your career journey</p>
                </div>
                
                <form action="/register" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="fas fa-user me-2"></i>Username
                        </label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="fas fa-envelope me-2"></i>Email address
                        </label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="fas fa-lock me-2"></i>Password
                        </label>
                        <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="fas fa-file-pdf me-2"></i>Upload Resume
                        </label>
                        <input type="file" name="resume" class="form-control" accept=".pdf" required>
                        <div class="form-text">
                            <i class="fas fa-info-circle me-1"></i>PDF format only
                        </div>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-rocket me-2"></i>Register
                        </button>
                    </div>
                </form>
                
                <div class="text-center small mt-4">
                    <hr class="my-3">
                    <p class="mb-0 text-muted">
                        Already have an account? <a href="/login" class="text-decoration-none fw-semibold" style="color: #11998e;">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
